<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Автосалон</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<nav class="navbar">
  <a href="/">Головна</a>
  <a href="/cars.html">Автомобілі</a>
  <a href="/clients.html">Клієнти</a>
  <a href="/configurations.html">Комплектації</a>
  <a href="/sales.html">Продажі</a>
</nav>

<main class="container">
  <h1>Автосалон</h1>
  <p class="subtitle">Система керування автосалоном</p>

  <div class="stats">
    <div class="stat">
      <span>Автомобілі</span>
      <strong id="vehiclesCount">0</strong>
    </div>

    <div class="stat">
      <span>Клієнти</span>
      <strong id="clientsCount">0</strong>
    </div>

    <div class="stat">
      <span>Комплектації</span>
      <strong id="configurationsCount">0</strong>
    </div>

    <div class="stat">
      <span>Продажі</span>
      <strong id="salesCount">0</strong>
    </div>
  </div>

  <div class="welcome">
    <h2>Вітаємо в системі автосалону</h2>
    <p>
      Використовуйте меню зверху, щоб додавати автомобілі,

    </p>
  </div>

<script src="/app.js"></script>
